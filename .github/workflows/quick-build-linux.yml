name: Quick Linux Build

# Super-quick Linux amd64 binary, on demand. Default channels minus voice
# (no local-stt / local-tts): skips whisper.cpp + rodio/ALSA — the heavy
# half of the build. No tests, no matrix, no multi-platform.
#
# NOTE: upstream lacks full #[cfg] gates — dropping channel features
# (discord/slack/whatsapp) breaks the compile (verified 2026-08-24, run
# 32785342664). Only voice features are safely removable today.
#
# Sync-from-origin-first: the checkout step pins the UPSTREAM repo (main),
# so every dispatch compiles adolfousier/opencrabs main tip — never a stale
# fork branch.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux amd64 (upstream main, minimal features)
    runs-on: ubuntu-latest
    steps:
      - name: Sync from origin (adolfousier/opencrabs main)
        uses: actions/checkout@v5
        with:
          repository: adolfousier/opencrabs
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (release, default minus voice, no tests)
        run: cargo build --locked --release --no-default-features --features "telegram,whatsapp,discord,slack,trello,browser,rtk"

      - name: Strip
        run: strip target/release/opencrabs

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: opencrabs-linux-amd64
          path: target/release/opencrabs
          if-no-files-found: error
